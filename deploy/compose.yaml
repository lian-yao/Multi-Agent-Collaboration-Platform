name: multi-agent-collaboration-platform

services:
  frontend:
    build:
      context: ..
      dockerfile: deploy/docker/frontend.Dockerfile
    image: multi-agent-collaboration-platform-frontend:latest
    ports:
      - "5173:80"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
    image: multi-agent-collaboration-platform-backend:latest
    environment:
      AGENT_LLM_PROVIDER: ${AGENT_LLM_PROVIDER:-openai}
      AGENT_OPENAI_MODEL: ${AGENT_OPENAI_MODEL:-}
      AGENT_OPENAI_BASE_URL: ${AGENT_OPENAI_BASE_URL:-}
      AGENT_OPENAI_API_KEY: ${AGENT_OPENAI_API_KEY:-}
      AGENT_OLLAMA_BASE_URL: ${AGENT_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      AGENT_OLLAMA_MODEL: ${AGENT_OLLAMA_MODEL:-qwen2.5-coder:7b}
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/multi_agent
      DAPR_HTTP_ENDPOINT: http://dapr-sidecar:3500
      DAPR_GRPC_ENDPOINT: dapr-sidecar:50001
      # 容器内 localhost 指不到同网络的 Jaeger；显式指向 compose 服务名。
      OBS_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      OBS_TRACING_ENABLED: "true"
      OBS_METRICS_SINK: postgres
      # 用户登记的 MCP Server（ADR-026）：登记并「发现」之后，其工具要进 Agent 的
      # 工具集与 GET /api/v1/tools。代码默认关闭（免让工具目录依赖配置库），部署侧
      # 显式打开；要退回「只暴露平台内置工具」设 MCP_INCLUDE_REGISTERED_SERVERS=false。
      MCP_INCLUDE_REGISTERED_SERVERS: ${MCP_INCLUDE_REGISTERED_SERVERS:-true}
      # Agent 的网页搜索出口（ADR-032）：默认走同网络的 search-gateway——平台默认的
      # DuckDuckGo Instant Answer 在部分网络连不通，Agent 会一直搜不到资料。要换回
      # 官方端点或自建网关，用 TOOL_SEARCH_ENDPOINT 覆盖。
      TOOL_SEARCH_ENDPOINT: ${TOOL_SEARCH_ENDPOINT:-http://search-gateway:8800/search}
      # 工作区（ADR-033 阶段 1）：容器内根固定 /workspace，宿主目录由下面的卷挂载决定。
      # 阶段 1 只有只读档位；写档位与沙箱挂载在阶段 2。
      WORKSPACE_ROOT: /workspace
      WORKSPACE_ENABLED: ${WORKSPACE_ENABLED:-true}
      # 沙箱容器建在**宿主机**守护进程上（见下面 volumes），所以沙箱镜像必须先存在于宿主机。
      # 这里指到本项目自建镜像：compose 一定会把它构建出来，离线/内网环境也能用。
      # 能拉到官方镜像的环境可以删掉这行，回落到代码默认的 python:3.12-slim（更小、无本项目代码）。
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-multi-agent-collaboration-platform-backend:latest}
      # 沙箱进程身份（ADR-033 §7）。代码默认是 none→nobody，但 Docker Desktop 把 bind
      # 挂载一律显示成 uid 0，因此以 nobody 运行的沙箱**写不进**工作区；Linux 宿主上则是
      # 「要写用户目录就得用宿主 uid」。所以这里默认 0（沙箱本身仍禁网、只读根文件系统、
      # cap_drop ALL、无 socket）；要更严就把它改成你的宿主 uid，或直接
      # WORKSPACE_SANDBOX_MOUNT=ro 用文件工具写（那条路有审批）。
      SANDBOX_UID: ${SANDBOX_UID:-0}
      SANDBOX_GID: ${SANDBOX_GID:-0}
      # 出网策略（ADR-034）：默认只放公网，内网/保留网段一律拦；白/黑名单按域名。
      EGRESS_MODE: ${EGRESS_MODE:-public_only}
      EGRESS_ALLOW_HOSTS: ${EGRESS_ALLOW_HOSTS:-}
      EGRESS_DENY_HOSTS: ${EGRESS_DENY_HOSTS:-}
      # 平台内部依赖的**精确主机名**：放行的只是这些服务，不是"整个内网"。
      EGRESS_INTERNAL_HOSTS: ${EGRESS_INTERNAL_HOSTS:-search-gateway,dapr-sidecar,redis,postgres,jaeger}
      # 端口白名单：443 给公网；8800 是 search-gateway 自己的端口。
      # 用 Ollama 时要加上 11434（端口与私网豁免是两件事，见 ADR-034）。
      EGRESS_ALLOWED_PORTS: ${EGRESS_ALLOWED_PORTS:-443,8800}
      EGRESS_MODEL_EXEMPT: ${EGRESS_MODEL_EXEMPT:-true}
      # 强制出网代理（ADR-034 §4）：应用层判定之外再加一道硬边界。设空则退回
      # 「应用侧自己解析 + 钉扎」（默认路径，仍然拦私网）。
      EGRESS_PROXY_URL: ${EGRESS_PROXY_URL:-http://egress-proxy:8888}
      # 让 MCP / 模型等自建连接的 SDK 也走代理：它们认这些环境变量（httpx trust_env）。
      # NO_PROXY 必须排除平台内部依赖与内网模型端点，否则内部调用会被代理拦下。
      HTTP_PROXY: ${EGRESS_PROXY_URL:-http://egress-proxy:8888}
      HTTPS_PROXY: ${EGRESS_PROXY_URL:-http://egress-proxy:8888}
      http_proxy: ${EGRESS_PROXY_URL:-http://egress-proxy:8888}
      https_proxy: ${EGRESS_PROXY_URL:-http://egress-proxy:8888}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,dapr-sidecar,redis,postgres,jaeger,search-gateway,egress-proxy,host.docker.internal}
      # 沙箱联网时用它作为唯一出口（SANDBOX_NETWORK_ENABLED=true 才生效）。
      SANDBOX_EGRESS_PROXY_URL: ${EGRESS_PROXY_URL:-http://egress-proxy:8888}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      # 敏感工具的执行边界（ADR-023）：沙箱需要向宿主机守护进程申请一次性容器。
      # 代价是 backend 间接拿到宿主机 root 等价权限——只把 8000 暴露给可信网络。
      # 宿主机上该路径不存在时 Docker 会创建同名**目录**（不报错），此时用
      # SANDBOX_DOCKER_SOCKET 指向真实套接字（如 Podman 的 /run/podman/podman.sock）。
      - ${SANDBOX_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      # 工作区（ADR-033）：宿主固定根挂到容器 /workspace。**别把项目仓库或 deploy/
      # 挂进来**——阶段 2 起沙箱对它可写，而仓库里是平台自己的源码。
      - ${WORKSPACE_HOST_ROOT:-../workspaces}:/workspace
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started

  search-gateway:
    # web_search 的本地出口：把可达的 Bing RSS 转成工具要的 JSON 契约（ADR-032）。
    # 不发布宿主端口——它只服务同一 compose 网络里的 backend。
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
    image: multi-agent-collaboration-platform-backend:latest
    command:
      - python
      - scripts/search_gateway.py
      - --host
      - 0.0.0.0
      - --port
      - "8800"
    environment:
      # 网关自己的上游出网也要受策略约束（ADR-034 第 4 条）：它只用标准库，靠代理环境
      # 变量接入，域名与私网判定都在代理侧做。
      HTTP_PROXY: ${EGRESS_PROXY_URL:-http://egress-proxy:8888}
      HTTPS_PROXY: ${EGRESS_PROXY_URL:-http://egress-proxy:8888}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,egress-proxy}
    healthcheck:
      # `/health` 不打上游：Bing 抖动只该影响搜索，不该把容器标成 unhealthy。
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8800/health', timeout=5).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  egress-proxy:
    # 出网策略的**硬边界**（ADR-034 §4）：应用层挡不住的新工具、第三方库与 SDK 自建连接，
    # 只要把流量逼到这张网里的代理上就都归它管。默认不发布宿主端口。
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
    image: multi-agent-collaboration-platform-backend:latest
    command:
      - python
      - scripts/egress_proxy.py
      - --host
      - 0.0.0.0
      - --port
      - "8888"
    environment:
      EGRESS_MODE: ${EGRESS_MODE:-public_only}
      EGRESS_ALLOW_HOSTS: ${EGRESS_ALLOW_HOSTS:-}
      EGRESS_DENY_HOSTS: ${EGRESS_DENY_HOSTS:-}
      # 代理只服务**公网**访问：内部服务由客户端直连（NO_PROXY 已排除）。
      # 把 redis/postgres 写进来，等于把它们变成「任何能连代理的容器都能探测的目标」。
      EGRESS_INTERNAL_HOSTS: ""
      EGRESS_ALLOWED_PORTS: ${EGRESS_ALLOWED_PORTS:-443,8800}
      # 代理不能再配代理（会绕圈）：脚本启动时会显式拒绝。
      EGRESS_PROXY_URL: ""
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket,sys; s=socket.create_connection(('127.0.0.1',8888),5); s.close()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  dapr-sidecar:
    image: ghcr.io/dapr/daprd:1.18.2
    command:
      - ./daprd
      - --app-id
      - backend
      - --app-channel-address
      - backend
      - --app-port
      - "8000"
      - --resources-path
      - /components
      - --placement-host-address
      - placement:50005
      - --scheduler-host-address
      - scheduler:50006
      - --dapr-http-port
      - "3500"
    volumes:
      - ./dapr/components:/components
    ports:
      - "3500:3500"
    depends_on:
      backend:
        condition: service_healthy
      placement:
        condition: service_started
      scheduler:
        condition: service_started

  placement:
    image: ghcr.io/dapr/placement:1.18.2
    command:
      - ./placement
      - --port
      - "50005"

  scheduler:
    image: ghcr.io/dapr/scheduler:1.18.2
    command:
      - ./scheduler
      - --etcd-data-dir
      - /tmp/dapr-scheduler
      - --override-broadcast-host-port
      - scheduler:50006
      - --etcd-client-listen-address
      - 0.0.0.0

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: multi_agent
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d multi_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    image: docker.m.daocloud.io/jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: docker.m.daocloud.io/prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

volumes:
  postgres-data:
