name: multi-agent-collaboration-platform

services:
  frontend:
    build:
      context: ..
      dockerfile: deploy/docker/frontend.Dockerfile
    image: multi-agent-collaboration-platform-frontend:latest
    ports:
      - "5173:80"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
    image: multi-agent-collaboration-platform-backend:latest
    environment:
      AGENT_LLM_PROVIDER: ${AGENT_LLM_PROVIDER:-openai}
      AGENT_OPENAI_MODEL: ${AGENT_OPENAI_MODEL:-}
      AGENT_OPENAI_BASE_URL: ${AGENT_OPENAI_BASE_URL:-}
      AGENT_OPENAI_API_KEY: ${AGENT_OPENAI_API_KEY:-}
      AGENT_OLLAMA_BASE_URL: ${AGENT_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      AGENT_OLLAMA_MODEL: ${AGENT_OLLAMA_MODEL:-qwen2.5-coder:7b}
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/multi_agent
      DAPR_HTTP_ENDPOINT: http://dapr-sidecar:3500
      DAPR_GRPC_ENDPOINT: dapr-sidecar:50001
      # 容器内 localhost 指不到同网络的 Jaeger；显式指向 compose 服务名。
      OBS_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      OBS_TRACING_ENABLED: "true"
      OBS_METRICS_SINK: postgres
      # 用户登记的 MCP Server（ADR-026）：登记并「发现」之后，其工具要进 Agent 的
      # 工具集与 GET /api/v1/tools。代码默认关闭（免让工具目录依赖配置库），部署侧
      # 显式打开；要退回「只暴露平台内置工具」设 MCP_INCLUDE_REGISTERED_SERVERS=false。
      MCP_INCLUDE_REGISTERED_SERVERS: ${MCP_INCLUDE_REGISTERED_SERVERS:-true}
      # 沙箱容器建在**宿主机**守护进程上（见下面 volumes），所以沙箱镜像必须先存在于宿主机。
      # 这里指到本项目自建镜像：compose 一定会把它构建出来，离线/内网环境也能用。
      # 能拉到官方镜像的环境可以删掉这行，回落到代码默认的 python:3.12-slim（更小、无本项目代码）。
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-multi-agent-collaboration-platform-backend:latest}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      # 敏感工具的执行边界（ADR-023）：沙箱需要向宿主机守护进程申请一次性容器。
      # 代价是 backend 间接拿到宿主机 root 等价权限——只把 8000 暴露给可信网络。
      # 宿主机上该路径不存在时 Docker 会创建同名**目录**（不报错），此时用
      # SANDBOX_DOCKER_SOCKET 指向真实套接字（如 Podman 的 /run/podman/podman.sock）。
      - ${SANDBOX_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started

  dapr-sidecar:
    image: ghcr.io/dapr/daprd:1.18.2
    command:
      - ./daprd
      - --app-id
      - backend
      - --app-channel-address
      - backend
      - --app-port
      - "8000"
      - --resources-path
      - /components
      - --placement-host-address
      - placement:50005
      - --scheduler-host-address
      - scheduler:50006
      - --dapr-http-port
      - "3500"
    volumes:
      - ./dapr/components:/components
    ports:
      - "3500:3500"
    depends_on:
      backend:
        condition: service_healthy
      placement:
        condition: service_started
      scheduler:
        condition: service_started

  placement:
    image: ghcr.io/dapr/placement:1.18.2
    command:
      - ./placement
      - --port
      - "50005"

  scheduler:
    image: ghcr.io/dapr/scheduler:1.18.2
    command:
      - ./scheduler
      - --etcd-data-dir
      - /tmp/dapr-scheduler
      - --override-broadcast-host-port
      - scheduler:50006
      - --etcd-client-listen-address
      - 0.0.0.0

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: multi_agent
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d multi_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    image: docker.m.daocloud.io/jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: docker.m.daocloud.io/prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

volumes:
  postgres-data:
