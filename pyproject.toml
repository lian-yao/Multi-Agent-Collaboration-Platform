[project]
name = "multi-agent-collaboration-platform"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg==0.31.0",
    "dapr==1.18.3",
    "dapr-agents==1.0.6",
    "dapr-ext-fastapi==1.18.3",
    "dapr-ext-workflow==1.18.3",
    "fastapi==0.141.1",
    "langchain-ollama==1.1.0",
    "langchain-openai==1.6.0",
    "langgraph==1.2.11",
    "mcp==1.29.1",
    "ollama==0.6.2",
    "openai==2.54.0",
    "opentelemetry-exporter-otlp-proto-http==1.39.1",
    "opentelemetry-sdk==1.39.1",
    "psycopg[binary]==3.3.5",
    "pydantic==2.12.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "redis==8.1.0",
    "sqlalchemy==2.0.52",
    "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
